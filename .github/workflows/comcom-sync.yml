name: Sync Odoo -> Supabase (comcom)
on:
  # Cron automatique DESACTIVE : GitHub ne respecte pas l'horaire (delais
  # de 30-50 min frequents). On passe en 100% manuel via le bouton du
  # dashboard (declenchement workflow_dispatch, fiable et rapide).
  # Pour reactiver l'automatique un jour, decommenter les 2 lignes ci-dessous.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:          # lancement a la demande (bouton dashboard + onglet Actions)
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: pip install -r scripts/requirements.txt
      - name: Lancer la synchronisation
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync_comcom.py
